<!doctype html><html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestão do casamento — Aniceta & Kerusso</title><link rel="stylesheet" href="/assets/app.css"></head><body class="app-body"><main class="app-shell"><nav class="app-nav"><a href="/">Ver convite</a><a href="/presentes/">Ver presentes</a></nav><h1>Gestão do casamento</h1><p id="admin-status" role="status"></p><form id="login"><h2>Acesso dos noivos</h2><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Entrar</button></div></form><section id="dashboard" hidden><div class="actions"><button id="refresh" type="button" class="secondary">Actualizar</button><button id="export" type="button" class="secondary">Exportar convidados (CSV)</button><button id="logout" type="button" class="secondary">Terminar sessão</button></div><div id="stats" class="stats"></div><h2>Adicionar convidado</h2><form id="guest-form"><label for="new-name">Nome do convidado</label><input id="new-name" required maxlength="200"><label for="new-phone">Telefone (opcional)</label><input id="new-phone" type="tel" maxlength="40"><div class="actions"><button>Adicionar convidado</button></div></form><label for="search">Pesquisar convidados</label><input id="search" type="search" placeholder="Nome ou telefone"><div id="guests"></div><hr><h2>Lista de presentes</h2><p class="small">Os presentes iniciais são exemplos. Edite-os para definir a lista do casal. Libertar uma reserva permite que outro convidado escolha esse presente.</p><form id="gift-form"><label for="gift-name">Nome do presente</label><input id="gift-name" required maxlength="200"><label for="gift-description">Descrição</label><textarea id="gift-description" maxlength="1000"></textarea><div class="actions"><button>Adicionar presente</button></div></form><div id="admin-gifts" class="grid"></div></section></main><script type="module" src="/assets/admin.js"></script></body></html>
